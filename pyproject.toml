[project]
name = "tgbot"
version = "1.0.0"
description = "Self-hosted Telegram AI bot for OpenAI-compatible APIs"
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.31",
    "aiohttp-socks>=0.10",
    "openai>=3.0",
    "httpx[socks]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.6",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
